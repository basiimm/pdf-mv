<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>PDF Workflow — PDF.mv</title>

    <link href="/src/css/styles.css" rel="stylesheet" />
    <link href="/src/design-system/canvas-tools.css" rel="stylesheet" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/images/favicon-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/images/favicon-512x512.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/apple-touch-icon.png"
    />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
  </head>

  <body
    class="antialiased ds-bg ds-text h-screen flex flex-col overflow-hidden"
  >
    <!-- Main Workflow Layout -->
    <div id="workflow-app" class="flex flex-1 min-h-0">
      <!-- LEFT SIDEBAR: Node Toolbox -->
      <aside
        id="toolbox-sidebar"
        class="w-60 border-r flex-col overflow-y-auto flex-shrink-0 hidden md:flex max-md:fixed max-md:inset-y-0 max-md:left-0 max-md:z-40 max-md:shadow-2xl"
      >
        <div class="p-3 border-b" style="border-color: var(--ds-border)">
          <h2 class="font-bold text-sm mb-2" style="color: var(--ds-text)">
            Nodes
          </h2>
          <input
            id="node-search"
            type="text"
            placeholder="Search nodes..."
            class="ds-input"
          />
        </div>

        <div id="toolbox-categories" class="flex-1 p-2 space-y-2 text-sm"></div>
      </aside>
      <div
        id="toolbox-backdrop"
        class="hidden max-md:fixed max-md:inset-0 max-md:z-30"
        style="background: var(--ds-backdrop)"
      ></div>

      <!-- CENTER: Canvas + Toolbar -->
      <main class="flex-1 flex flex-col min-w-0">
        <!-- Top Toolbar -->
        <div
          id="workflow-toolbar"
          class="ds-toolbar px-2 md:px-4 gap-1.5 md:gap-2"
        >
          <button
            id="toolbox-toggle"
            type="button"
            class="ds-icon-button ds-button md:hidden"
            data-variant="quiet"
            data-size="m"
          >
            <i class="ph ph-plus-circle text-lg"></i>
          </button>
          <button
            id="run-btn"
            type="button"
            class="ds-button"
            data-variant="accent"
            data-size="m"
          >
            <i class="ph ph-play text-base"></i>
            <span class="hidden md:inline">Run</span>
          </button>
          <button
            id="clear-btn"
            type="button"
            class="ds-button"
            data-variant="secondary"
            data-size="m"
          >
            <i class="ph ph-trash text-base md:hidden"></i>
            <span class="hidden md:inline">Clear</span>
          </button>
          <div class="flex-1"></div>
          <button
            id="save-btn"
            type="button"
            class="ds-button"
            data-variant="secondary"
            data-size="m"
          >
            <i class="ph ph-floppy-disk text-sm"></i>
            <span class="hidden md:inline">Save</span>
          </button>
          <button
            id="load-btn"
            type="button"
            class="ds-button"
            data-variant="secondary"
            data-size="m"
          >
            <i class="ph ph-folder-open text-sm"></i>
            <span class="hidden md:inline">Load</span>
          </button>
          <button
            id="export-btn"
            type="button"
            class="ds-button"
            data-variant="secondary"
            data-size="m"
          >
            <i class="ph ph-export text-sm"></i>
            <span class="hidden md:inline">Export</span>
          </button>
          <button
            id="import-btn"
            type="button"
            class="ds-button"
            data-variant="secondary"
            data-size="m"
          >
            <i class="ph ph-download-simple text-sm"></i>
            <span class="hidden md:inline">Import</span>
          </button>
        </div>

        <!-- Rete.js Canvas -->
        <div id="rete-container" class="flex-1 relative"></div>

        <!-- Bottom Status Bar -->
        <div
          id="status-bar"
          class="h-7 border-t hidden md:flex items-center px-4 text-xs"
          style="
            background: var(--ds-surface);
            border-color: var(--ds-border);
            color: var(--ds-text-muted);
          "
        >
          <span id="status-text">Ready</span>
          <div class="flex-1"></div>
          <span id="node-count">0 nodes</span>
        </div>
      </main>

      <!-- RIGHT SIDEBAR: Selected Node Settings -->
      <aside
        id="settings-sidebar"
        class="w-64 border-l flex flex-col overflow-y-auto flex-shrink-0 hidden max-md:fixed max-md:inset-y-0 max-md:right-0 max-md:z-40 max-md:shadow-2xl"
        style="background: var(--ds-surface); border-color: var(--ds-border)"
      >
        <div
          class="p-3 border-b flex items-center justify-between"
          style="border-color: var(--ds-border)"
        >
          <h2
            id="settings-title"
            class="font-bold text-sm"
            style="color: var(--ds-text)"
          >
            Settings
          </h2>
          <button
            id="close-settings"
            type="button"
            class="ds-icon-button ds-button"
            data-variant="quiet"
            data-size="s"
          >
            <i class="ph ph-x text-base"></i>
          </button>
        </div>
        <div id="settings-content" class="flex-1 p-3 space-y-3"></div>
      </aside>
    </div>

    <!-- Loader Modal -->
    <div
      id="loader-modal"
      class="hidden fixed inset-0 wf-modal-backdrop flex items-center justify-center z-50"
    >
      <div class="wf-modal-panel p-8 flex flex-col items-center gap-4">
        <div class="solid-spinner"></div>
        <p
          id="loader-text"
          class="text-lg font-medium"
          style="color: var(--ds-text)"
        >
          Processing...
        </p>
      </div>
    </div>

    <!-- Save Template Modal -->
    <div
      id="save-template-modal"
      class="fixed inset-0 wf-modal-backdrop flex items-center justify-center z-50 hidden"
    >
      <div class="wf-modal-panel p-6 max-w-sm w-full mx-4">
        <div class="flex items-center gap-3 mb-5">
          <div
            class="w-9 h-9 rounded-xl flex items-center justify-center"
            style="background: var(--ds-selected)"
          >
            <i
              class="ph ph-floppy-disk text-lg"
              style="color: var(--ds-accent-text)"
            ></i>
          </div>
          <h3 class="text-base font-semibold" style="color: var(--ds-text)">
            Save Template
          </h3>
        </div>
        <label class="ds-field__label block mb-1.5">Template Name</label>
        <input
          id="save-template-name"
          type="text"
          placeholder="e.g. Invoice Workflow"
          class="ds-input mb-1"
        />
        <p id="save-template-error" class="ds-field__error mb-4 hidden"></p>
        <div class="flex gap-2 mt-4">
          <button
            id="save-template-cancel"
            type="button"
            class="ds-button flex-1"
            data-variant="secondary"
            data-size="m"
          >
            Cancel
          </button>
          <button
            id="save-template-confirm"
            type="button"
            class="ds-button flex-1"
            data-variant="accent"
            data-size="m"
          >
            Save
          </button>
        </div>
      </div>
    </div>

    <!-- Load Template Modal -->
    <div
      id="load-template-modal"
      class="fixed inset-0 wf-modal-backdrop flex items-center justify-center z-50 hidden"
    >
      <div class="wf-modal-panel p-6 max-w-md w-full mx-4">
        <div class="flex items-center gap-3 mb-5">
          <div
            class="w-9 h-9 rounded-xl flex items-center justify-center"
            style="background: var(--ds-selected)"
          >
            <i
              class="ph ph-folder-open text-lg"
              style="color: var(--ds-accent-text)"
            ></i>
          </div>
          <h3 class="text-base font-semibold" style="color: var(--ds-text)">
            Load Template
          </h3>
        </div>
        <div
          id="load-template-list"
          class="space-y-1.5 max-h-64 overflow-y-auto mb-4"
        ></div>
        <p
          id="load-template-empty"
          class="text-sm text-center py-6 hidden"
          style="color: var(--ds-text-muted)"
        >
          No saved templates yet.
        </p>
        <button
          id="load-template-cancel"
          type="button"
          class="ds-button w-full mt-2"
          data-variant="secondary"
          data-size="m"
        >
          Cancel
        </button>
      </div>
    </div>

    <!-- Alert Modal -->
    <div
      id="alert-modal"
      class="fixed inset-0 wf-modal-backdrop flex items-center justify-center z-50 hidden"
    >
      <div class="wf-modal-panel p-6 max-w-sm w-full mx-4">
        <h3
          id="alert-title"
          class="text-lg font-semibold mb-2"
          style="color: var(--ds-text)"
        >
          Alert
        </h3>
        <p
          id="alert-message"
          class="text-sm mb-6"
          style="color: var(--ds-text-muted)"
        ></p>
        <button
          id="alert-ok"
          type="button"
          class="ds-button w-full"
          data-variant="accent"
          data-size="m"
        >
          OK
        </button>
      </div>
    </div>

    <!-- PDF Password Modal -->
    <div
      id="pdf-password-modal"
      class="fixed inset-0 flex items-center justify-center z-50 hidden"
      style="background: var(--ds-backdrop)"
    >
      <div class="wf-modal-panel p-5 w-80 mx-4">
        <h3 class="font-semibold text-sm mb-1" style="color: var(--ds-text)">
          <i class="ph ph-lock text-sm"></i> Protected PDF
        </h3>
        <p
          id="pdf-password-filename"
          class="text-xs mb-3 truncate"
          style="color: var(--ds-text-muted)"
        ></p>
        <input
          type="password"
          id="pdf-password-input"
          placeholder="Enter password"
          class="ds-input mb-1"
        />
        <p id="pdf-password-error" class="ds-field__error mb-3 hidden">
          Incorrect password
        </p>
        <div class="flex gap-2">
          <button
            id="pdf-password-skip"
            type="button"
            class="ds-button flex-1"
            data-variant="secondary"
            data-size="s"
          >
            Skip
          </button>
          <button
            id="pdf-password-unlock"
            type="button"
            class="ds-button flex-1"
            data-variant="accent"
            data-size="s"
          >
            Unlock
          </button>
        </div>
      </div>
    </div>

    <script type="module">
      import '@phosphor-icons/web/regular';
    </script>
    <script type="module" src="/src/js/logic/pdf-workflow-page.ts"></script>
    <script type="module" src="/src/js/mobileMenu.ts"></script>
    <script type="module" src="/src/js/main.ts"></script>
  </body>
</html>
